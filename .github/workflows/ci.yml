name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  repository-hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject whitespace errors
        run: |
          empty_tree="$(git hash-object -t tree /dev/null)"
          git diff --check "$empty_tree" HEAD -- .
      - name: Reject tracked Python bytecode
        run: test -z "$(git ls-files '*__pycache__*' '*.pyc')"

  static-audit:
    name: static frontend and design audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check JavaScript bundles and audit scripts
        run: |
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find apps tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
      - name: Run embodied platform structural audit
        run: node tests/embodied-platform-audit.mjs

  backend:
    name: backend tests (Python ${{ matrix.python-version }}, JSON store)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install media tooling
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install backend with test dependencies
        run: python -m pip install -e "backend[dev]"
      - name: Run backend suite against JSON repository
        run: cd backend && python -m pytest tests -q -rs

  backend-postgres:
    name: backend tests (Postgres repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: xingju_ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      XINGJU_TEST_PG_DSN: postgresql://postgres:ci@localhost:5432/xingju_ci
      XINGJU_EMBODIED_PLATFORM_DSN: postgresql://postgres:ci@localhost:5432/xingju_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install media tooling
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Install backend with test dependencies
        run: python -m pip install -e "backend[dev]"
      - name: Run full backend suite against PgRepository
        run: cd backend && python -m pytest tests -q -rs

  docker-build:
    name: docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t embodied-platform-console:ci .

  docker-runtime-smoke:
    name: docker runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Build smoke-test image
        run: docker build -t embodied-platform-console:smoke .
      - name: Start container
        run: |
          docker run --rm -d --name embodied-platform-smoke \
            -p 8099:8099 \
            -e XINGJU_EMBODIED_PLATFORM_AUTH_SECRET=ci-secret \
            -e XINGJU_EMBODIED_PLATFORM_LOGIN_PASSCODE=ci-passcode \
            embodied-platform-console:smoke
      - name: Verify health and mounted apps
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8099/healthz; then
              break
            fi
            if [ "$i" -eq 40 ]; then
              docker logs embodied-platform-smoke
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8099/app/ >/tmp/app.html
          curl -fsS "http://127.0.0.1:8099/labeler/?dataset=demo&episode=0" >/tmp/labeler.html
          grep -q "具身平台运营台" /tmp/app.html
          grep -q "标注台" /tmp/labeler.html
      - name: Show logs on failure
        if: failure()
        run: docker logs embodied-platform-smoke || true
      - name: Stop container
        if: always()
        run: docker stop embodied-platform-smoke || true
