services:
  app:
    build: .
    env_file: .env
    volumes:
      - state:/srv/backend/data
    restart: unless-stopped
    # no published port — only caddy talks to :8099 on the compose network

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # domain Caddy serves (auto-TLS); defaults to localhost for local compose
      XINGJU_DOMAIN: ${XINGJU_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  state:
  caddy_data:
  caddy_config:
