services:
  app:
    build: .
    env_file: .env
    volumes:
      - state:/srv/backend/data
    restart: unless-stopped
    # no published port — only caddy talks to :8099 on the compose network

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # domain Caddy serves (auto-TLS); defaults to localhost for local compose
      XINGJU_DOMAIN: ${XINGJU_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

  # Postgres mode (scale-out): uncomment, set XINGJU_EMBODIED_PLATFORM_DSN in
  # .env (postgresql://platform:change-me@postgres:5432/platform), and the app
  # switches from the single-instance JSON store to PgRepository — at that
  # point N app replicas are safe behind caddy.
  # postgres:
  #   image: postgres:16
  #   environment:
  #     POSTGRES_USER: platform
  #     POSTGRES_PASSWORD: change-me
  #     POSTGRES_DB: platform
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  state:
  caddy_data:
  caddy_config:
  # pgdata:
