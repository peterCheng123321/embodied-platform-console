[project]
name = "embodied-platform-console"
version = "0.1.0"
description = "Embodied-AI production control console — JSON-file-backed FastAPI API + offline-capable SPA"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.11",
    "pyarrow>=16",
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

# backend/ is a flat layout with non-package dirs (data/, tests/) next to the
# api package, so setuptools auto-discovery needs an explicit include for
# `pip install -e backend` to work (CI installs the package this way).
[tool.setuptools.packages.find]
include = ["api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Scoped to the rules the committed tree already passes, so the gate is green on day
# one without a tree-wide cleanup. `F` (pyflakes: undefined names, unused imports —
# the real agent-bug catchers) plus `E4` (import mechanics) and `E9` (syntax errors).
# Deliberately excluded for now, each with pre-existing hits a follow-up normalization
# PR will clean up before enabling: `E5` (line-length), `E7` (statement style, e.g.
# E702 multi-statement lines), plus `I` (import-sort), `UP` (pyupgrade), and
# `ruff format`. Expanding coverage later is a one-line `extend-select` change.
select = ["E4", "E9", "F"]
