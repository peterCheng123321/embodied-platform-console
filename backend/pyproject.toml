[project]
name = "embodied-platform-console"
version = "0.1.0"
description = "Embodied-AI production control console — JSON-file-backed FastAPI API + offline-capable SPA"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
