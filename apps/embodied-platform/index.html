<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>星聚 · 具身平台运营台</title>
  <link rel="manifest" href="assets/manifest.webmanifest">
  <link rel="stylesheet" href="/vendor/fonts/plex.css">
  <link rel="stylesheet" href="assets/embodied-platform.css?v=17">
</head>
<body>
  <header class="platform-header">
    <div class="header-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6.5" y="3.5" width="11" height="9" rx="2.5"></rect>
          <circle cx="10" cy="8" r="1.1" fill="currentColor" stroke="none"></circle>
          <circle cx="14" cy="8" r="1.1" fill="currentColor" stroke="none"></circle>
          <path d="M12 12.5v3"></path>
          <path d="M7.5 20.5h9"></path>
          <path d="M9 15.5h6a2 2 0 0 1 2 2v3H7v-3a2 2 0 0 1 2-2Z"></path>
        </svg>
      </span>
      <div>
        <p class="eyebrow">具身智能生产控制台</p>
        <h1>星聚 <span class="wordmark-tick" aria-hidden="true">·</span> 具身平台运营台</h1>
      </div>
    </div>
    <div class="header-actions">
      <span id="api-status" class="status-pill" aria-live="polite">启动中</span>
      <div class="login-zone">
        <button type="button" id="login-toggle" class="btn-secondary">登录</button>
        <span id="principal-label" hidden></span>
        <button type="button" id="logout-btn" class="btn-secondary" hidden>退出</button>
        <div id="login-form" role="dialog" aria-label="登录" hidden>
          <label class="login-field">操作者
            <input id="login-actor" type="text" autocomplete="username" value="operator-a">
          </label>
          <label class="login-field">角色
            <select id="login-role">
              <option value="admin">管理员 admin</option>
              <option value="data_manager">数据管理 data_manager</option>
              <option value="annotator">标注员 annotator</option>
              <option value="reviewer">复核员 reviewer</option>
              <option value="ml_engineer">算法工程师 ml_engineer</option>
              <option value="deployment_operator">部署操作员 deployment_operator</option>
              <option value="operator">运营 operator</option>
            </select>
          </label>
          <label class="login-field">通行码
            <input id="login-passcode" type="password" autocomplete="current-password">
          </label>
          <p class="login-hint">登录后将以签名身份解锁在线写入。</p>
          <div class="login-row">
            <button type="button" id="login-submit" class="btn-primary">登录</button>
          </div>
        </div>
      </div>
      <button type="button" data-action="reset-demo" class="btn-danger">重置演示数据</button>
      <button type="button" data-action="refresh-monitoring" class="btn-secondary">刷新</button>
    </div>
  </header>

  <main class="platform-workspace">
    <nav class="module-rail" aria-label="具身平台模块">
      <button type="button" data-module="data-management" class="active"><span class="rail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"></ellipse><path d="M5 6v12c0 1.66 3.13 3 7 3s7-1.34 7-3V6"></path><path d="M5 12c0 1.66 3.13 3 7 3s7-1.34 7-3"></path></svg></span>数据</button>
      <button type="button" data-module="collection"><span class="rail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="m9 8 1.6 1.6L15 5.5"></path><path d="M8 14h8"></path><path d="M8 18h5"></path></svg></span>采集</button>
      <button type="button" data-module="annotation"><span class="rail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 4 5 5L9 20H4v-5L15 4Z"></path><path d="m13 6 5 5"></path></svg></span>标注</button>
      <button type="button" data-module="training"><span class="rail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"></path></svg></span>训练</button>
      <button type="button" data-module="models"><span class="rail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"></path><path d="m4 7.5 8 4.5 8-4.5M12 12v9"></path></svg></span>模型</button>
      <button type="button" data-module="simulation"><span class="rail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"></path></svg></span>Sim2Real</button>
      <button type="button" data-module="deployment"><span class="rail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 14.5 12 3l6.5 11.5"></path><path d="M5.5 14.5 4 21l8-3 8 3-1.5-6.5"></path><path d="m9.5 13.5 5 0"></path></svg></span>部署</button>
      <button type="button" data-module="learning"><span class="rail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7a8 8 0 1 0 1.5 8"></path><path d="M20 3v4h-4"></path></svg></span>学习</button>
      <button type="button" data-module="monitoring"><span class="rail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 4 13 2.5-7H21"></path></svg></span>监控</button>
      <button type="button" data-module="audit"><span class="rail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"></path><path d="M14 3v5h5M9 13h6M9 17h6"></path></svg></span>审计</button>
      <button type="button" data-module="system"><span class="rail-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l1.6-1.2-1.8-3.1-1.9.7a7.5 7.5 0 0 0-2.6-1.5L13.9 2h-3.8l-.4 2.4a7.5 7.5 0 0 0-2.6 1.5l-1.9-.7-1.8 3.1 1.6 1.2a7.6 7.6 0 0 0 0 3L2.4 14.7l1.8 3.1 1.9-.7a7.5 7.5 0 0 0 2.6 1.5l.4 2.4h3.8l.4-2.4a7.5 7.5 0 0 0 2.6-1.5l1.9.7 1.8-3.1-1.6-1.2Z"></path></svg></span>系统</button>
    </nav>

    <section class="summary-grid" aria-label="平台概览">
      <article>
        <span>数据集</span>
        <strong id="metric-datasets">0</strong>
      </article>
      <article>
        <span>排队任务</span>
        <strong id="metric-queued">0</strong>
      </article>
      <article>
        <span>运行任务</span>
        <strong id="metric-running">0</strong>
      </article>
      <article>
        <span>学习队列</span>
        <strong id="metric-learning">0</strong>
      </article>
    </section>

    <section id="mode-banner" class="mode-banner" role="status" aria-live="polite" hidden></section>

    <section id="data-management-panel" class="module-panel active" data-module="data-management">
      <div class="panel-head">
        <div>
          <p class="eyebrow">多模态数据管理</p>
          <h2>数据集接入与片段登记</h2>
        </div>
        <button type="button" data-action="create-dataset" class="btn-primary">创建数据集</button>
      </div>
      <div class="form-grid">
        <label>名称<input id="dataset-name" value="warehouse-pick-v1"></label>
        <label>模态<select id="dataset-modality"><option value="vision_language_action">视觉-语言-动作</option><option value="multimodal">多模态</option><option value="vision">视觉</option><option value="action">动作</option></select></label>
        <label>机器人类型<input id="dataset-robot" value="mobile_manipulator"></label>
        <label class="wide-field">存储 URI<input id="dataset-uri" value="file:///robot-runs/warehouse-pick-v1"></label>
      </div>
      <div class="action-row">
        <button type="button" data-action="start-import" class="btn-primary">开始导入</button>
        <button type="button" data-action="create-episode" class="btn-primary">登记片段</button>
      </div>
      <div class="form-grid">
        <label>片段数据集<input id="episode-dataset" value="warehouse-pick-v1"></label>
        <label>片段 ID<input id="episode-id" value="episode-000042"></label>
        <label>机器人单元<input id="episode-cell" value="warehouse-a"></label>
        <label>帧数<input id="episode-frames" type="number" min="1" max="1000000" step="1" value="240"></label>
      </div>
      <div id="datasets-list" class="data-table"></div>
      <div id="episodes-list" class="data-table"></div>
    </section>

    <section id="collection-panel" class="module-panel" data-module="collection">
      <div class="panel-head">
        <div>
          <p class="eyebrow">第一人称采集流程</p>
          <h2>试采任务进度与复核</h2>
        </div>
        <button type="button" data-action="create-collection-run" class="btn-primary">创建试采批次</button>
      </div>
      <div class="form-grid">
        <label>流程<select id="collection-profile"><option value="first_person_trial_v1">第一人称试采流程</option></select></label>
        <label>采集对象<input id="collection-subject" value="operator-a"></label>
        <label>负责人<input id="collection-assignee" value="operator-a"></label>
        <label>批次 ID<input id="collection-run-id" value="crun_demo_first_person"></label>
      </div>
      <div id="collection-summary" class="collection-summary" aria-label="采集概览"></div>
      <div class="form-grid">
        <label>任务<select id="collection-task"><option value="task_01">task_01 · 笔帽拔下后插到笔杆尾端</option></select></label>
        <label>录制次数<input id="collection-attempt-index" type="number" min="1" max="8" step="1" value="2"></label>
        <label>状态<select id="collection-attempt-status"><option value="uploaded">已上传</option><option value="recorded">已录制</option><option value="deleted">已删除</option></select></label>
        <label class="wide-field">视频 URI<input id="collection-video-uri" value="file:///demo/first-person/task-01-attempt-02.mp4"></label>
        <label class="wide-field">口述文本<input id="collection-transcript" value="操作开始。操作结束，任务成功。"></label>
      </div>
      <div class="action-row">
        <button type="button" data-action="register-collection-attempt" class="btn-primary">登记视频</button>
      </div>
      <div class="form-grid">
        <label>复核视频 ID<input id="collection-review-attempt" value="cat_demo_task_01_001"></label>
        <label>结论<select id="collection-review-decision"><option value="accept">通过</option><option value="reject">拒绝</option><option value="needs_rework">返工</option></select></label>
        <label class="wide-field">问题代码<input id="collection-review-issues" value="" placeholder="missing_required_speech, gripper_out_of_frame"></label>
        <label class="wide-field">复核备注<input id="collection-review-notes" value=""></label>
      </div>
      <div class="action-row">
        <button type="button" data-action="review-collection-attempt" class="btn-primary">保存复核</button>
      </div>
      <div id="collection-task-matrix" class="data-table"></div>
      <div id="collection-attempt-list" class="data-table"></div>
    </section>

    <section id="annotation-panel" class="module-panel" data-module="annotation">
      <div class="panel-head">
        <div>
          <p class="eyebrow">智能标注平台</p>
          <h2>片段任务保存与复核队列</h2>
        </div>
        <div class="action-row">
          <a id="open-temporal-labeler" href="/labeler/?dataset=demo&amp;episode=0" class="btn-secondary">打开完整时间段标注器</a>
          <button type="button" data-action="save-annotation" class="btn-primary">保存标注</button>
        </div>
      </div>
      <div class="form-grid">
        <label>数据集 ID<input id="annotation-dataset" value="warehouse-pick-v1"></label>
        <label>片段 ID<input id="annotation-episode" value="episode-000042"></label>
        <label>负责人<input id="annotation-assignee" value="operator-a"></label>
        <label>状态<select id="annotation-status"><option value="review">待复核</option><option value="open">待处理</option><option value="accepted">已通过</option><option value="rework">返工</option></select></label>
      </div>
      <div id="annotation-list" class="data-table"></div>
    </section>

    <section id="training-panel" class="module-panel" data-module="training">
      <div class="panel-head">
        <div>
          <p class="eyebrow">模型训练与优化</p>
          <h2>策略微调任务</h2>
        </div>
        <button type="button" data-action="start-training" class="btn-primary">启动训练</button>
      </div>
      <div class="form-grid">
        <label>任务名称<input id="training-name" value="rt-policy-smoke"></label>
        <label>数据集 ID<input id="training-dataset" value="warehouse-pick-v1"></label>
        <label>基础模型<input id="training-base" value="rt-2-x"></label>
        <label>优化方式<select id="training-optimizer"><option value="lora">LoRA</option><option value="qlora">QLoRA</option><option value="distillation">蒸馏</option><option value="full">全量训练</option></select></label>
      </div>
      <div id="training-list" class="data-table"></div>
    </section>

    <section id="models-panel" class="module-panel" data-module="models">
      <div class="panel-head">
        <div>
          <p class="eyebrow">模型版本管理</p>
          <h2>模型仓库与当前发布版本</h2>
        </div>
        <button type="button" data-action="activate-model" class="btn-primary">激活模型</button>
      </div>
      <div class="form-grid">
        <label>名称<input id="model-name" value="mobile-policy"></label>
        <label>版本<input id="model-version" value="1.1.0"></label>
        <label class="wide-field">产物 URI<input id="model-uri" value="models://mobile-policy/1.1.0"></label>
      </div>
      <div id="models-list" class="data-table"></div>
    </section>

    <section id="simulation-panel" class="module-panel" data-module="simulation">
      <div class="panel-head">
        <div>
          <p class="eyebrow">仿真与虚实转换</p>
          <h2>场景验证任务</h2>
        </div>
        <button type="button" data-action="start-simulation" class="btn-primary">运行仿真</button>
      </div>
      <div class="form-grid">
        <label>场景<input id="simulation-scenario" value="bin-pick-distractors"></label>
        <label>模型 ID<input id="simulation-model" value="demo-model"></label>
        <label>仿真器<select id="simulation-simulator"><option value="isaac">Isaac</option><option value="mujoco">MuJoCo</option><option value="gazebo">Gazebo</option><option value="maniskill">ManiSkill</option></select></label>
        <label>指标<input id="simulation-metric" value="grasp transfer gap"></label>
      </div>
      <div id="simulation-list" class="data-table"></div>
    </section>

    <section id="deployment-panel" class="module-panel" data-module="deployment">
      <div class="panel-head">
        <div>
          <p class="eyebrow">边缘推理部署</p>
          <h2>机器人目标发布队列</h2>
        </div>
        <button type="button" data-action="create-deployment" class="btn-primary">创建部署</button>
      </div>
      <div class="form-grid">
        <label>模型 ID<input id="deployment-model" value="demo-model"></label>
        <label>目标硬件<input id="deployment-target" value="jetson-orin"></label>
        <label>环境<input id="deployment-env" value="warehouse-a"></label>
      </div>
      <div id="deployment-list" class="data-table"></div>
    </section>

    <section id="learning-panel" class="module-panel" data-module="learning">
      <div class="panel-head">
        <div>
          <p class="eyebrow">在线微调与学习</p>
          <h2>困难样本回流队列</h2>
        </div>
        <button type="button" data-action="enqueue-learning" class="btn-primary">加入学习队列</button>
      </div>
      <div class="form-grid">
        <label>片段 ID<input id="learning-episode" value="episode-000042"></label>
        <label>原因<input id="learning-reason" value="滑移恢复失败"></label>
        <label>优先级<select id="learning-priority"><option value="high">高</option><option value="normal">普通</option><option value="urgent">紧急</option><option value="low">低</option></select></label>
      </div>
      <div id="learning-list" class="data-table"></div>
    </section>

    <section id="monitoring-panel" class="module-panel" data-module="monitoring">
      <div class="panel-head">
        <div>
          <p class="eyebrow">可视化监控看板</p>
          <h2>运行健康与吞吐</h2>
        </div>
        <button type="button" data-action="refresh-monitoring" class="btn-secondary">刷新监控</button>
      </div>
      <div id="monitoring-board" class="mon-board" aria-label="监控指标看板"></div>
      <div id="monitoring-list" class="data-table"></div>
    </section>

    <section id="audit-panel" class="module-panel" data-module="audit">
      <div class="panel-head">
        <div>
          <p class="eyebrow">日志与审计</p>
          <h2>操作记录与变更轨迹</h2>
        </div>
        <button type="button" data-action="write-audit" class="btn-primary">写入审计事件</button>
      </div>
      <div class="form-grid">
        <label>动作<input id="audit-action" value="operator.note"></label>
        <label>资源<input id="audit-resource" value="runbook"></label>
        <label>详情<input id="audit-detail" value="交接已确认"></label>
      </div>
      <div id="audit-list" class="data-table"></div>
    </section>

    <section id="system-panel" class="module-panel" data-module="system">
      <div class="panel-head">
        <div>
          <p class="eyebrow">系统管理</p>
          <h2>离线兜底与治理设置</h2>
        </div>
        <button type="button" data-action="save-settings" class="btn-primary">保存设置</button>
      </div>
      <div class="form-grid">
        <label>保留天数<input id="settings-retention" type="number" value="30" min="1" max="3650" step="1"></label>
        <label>机器人集群<input id="settings-fleet" value="warehouse-fleet-a"></label>
        <label>离线模式<select id="settings-offline"><option value="true">启用</option><option value="false">停用</option></select></label>
        <label>边缘审批<select id="settings-approval"><option value="true">必须审批</option><option value="false">可选审批</option></select></label>
      </div>
      <div id="system-list" class="data-table"></div>
    </section>
  </main>

  <script src="assets/embodied-platform.js?v=17"></script>
</body>
</html>
